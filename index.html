<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Army Builders</title>
    <meta name="description" content="Warhammer 40,000 army list builders and tools." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05090b" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Army Builders" />
    <meta property="og:description" content="Warhammer 40,000 army list builders and tools." />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Atmosphere: grid, scanlines, drifting sweep, grain, vignette. -->
    <div class="fx" aria-hidden="true">
      <div class="fx-glow"></div>
      <div class="fx-grid"></div>
      <div class="fx-scanlines"></div>
      <div class="fx-sweep"></div>
      <div class="fx-noise"></div>
      <div class="fx-vignette"></div>
    </div>

    <main class="hud">
      <header class="masthead">
        <p class="eyebrow"><span class="eyebrow-mark"></span><span id="eyebrow"></span></p>

        <h1 class="title">
          <span id="title-lead" class="title-lead"></span
          ><span id="title-rest" class="title-rest"></span>
        </h1>

        <div class="rule">
          <span class="rule-line"></span>
          <span id="handle" class="handle"></span>
          <span class="rule-line"></span>
        </div>

        <p id="tagline" class="tagline"></p>
      </header>

      <nav id="links" class="links" aria-label="Army builders"></nav>

      <footer id="footer" class="footer"></footer>
    </main>

    <script src="links.js"></script>
  </body>
</html>
